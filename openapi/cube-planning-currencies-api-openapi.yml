      properties:
        id:
          type: integer
          readOnly: true
        account:
          type: integer
        is_default:
          type: boolean
        rate_type:
          type: string
          readOnly: true
        exchange_rate_type:
          type: integer
        from_currency:
          type: integer
          nullable: true
        to_currency:
          type: integer
          nullable: true
        constant_rate:
