components:
  schemas:
    PatchedConversionRate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_currency:
          type: integer
        to_currency:
          type: integer
        account:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,20})?$
        exchange_rate_type_id:
          type: integer
          nullable: true
          readOnly: true
        rateable_type:
          type: integer
          nullable: true
        rateable_id:
          type: string
          nullable: true
          maxLength: 36
        is_locked:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
    CompanyCurrency:
      type: object
      properties:
        default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - created_at
      - currency
    PatchedCurrency:
      type: object
      description: "Allows selectively disabling DRF uniqueness validation for ModelSerializers.\n\nModelSerializer runs unique field validation during `is_valid()`, even when the\nserializer is used only to deserialize or reference existing model data (i.e. with\nno intent to create or update an instance). This mixin enables callers to explicitly\nskip uniqueness checks for specific fields in those cases.\n\nUsage:\n    serializer = MySerializer(\n        data=payload,\n        skip_unique_validation_fields=('code',),\n    )"
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 10
        symbol:
          type: string
          maxLength: 10
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        exclusive_to_company_id:
          type: string
          format: uuid
        created_by_id:
          type: integer
          writeOnly: true
    ConversionRate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_currency:
          type: integer
        to_currency:
          type: integer
        account:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,17}(?:\.\d{0,20})?$
        exchange_rate_type_id:
          type: integer
          nullable: true
          readOnly: true
        rateable_type:
          type: integer
          nullable: true
        rateable_id:
          type: string
          nullable: true
          maxLength: 36
        is_locked:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - exchange_rate_type_id
      - from_currency
      - id
      - modified_at
      - rate
      - to_currency
    InlineForm:
      type: object
      properties:
        rateable_id:
          type: string
          nullable: true
        rateable_type:
          type: integer
          nullable: true
        from_currency:
          type: integer
        to_currency:
