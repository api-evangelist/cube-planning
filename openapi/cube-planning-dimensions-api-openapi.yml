  /dimensions/tld/{id}:
    put:
      operationId: dimensions_tld_update
      description: API for managing custom cube top-level dimensions (TLDs).
      summary: Rename a custom cube TLD
      parameters:
      - in: header
        name: X-Company-ID
        schema:
          type: string
        description: Associates request with company
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Dimensions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopLevelDimension'
            examples:
              RenameCustomTLD:
                value:
                  name: Projects
                summary: Rename custom TLD
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TopLevelDimension'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TopLevelDimension'
        required: true
      security:
      - OAuth2: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopLevelDimension'
          description: TLD renamed; response contains the updated dimension.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_serializer'
          description: Invalid request — e.g. default TLD rename, validation error
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_serializer'
          description: Permission denied — user cannot manage this dimension
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_serializer'
          description: Dimension not found or not a cube TLD
    delete:
      operationId: dimensions_tld_destroy
      description: API for managing custom cube top-level dimensions (TLDs).
      summary: Delete a custom cube TLD
      parameters:
      - in: header
        name: X-Company-ID
        schema:
          type: string
        description: Associates request with company
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Dimensions
      security:
      - OAuth2: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopLevelDimension'
              examples:
                DeleteCustomTLD—Accepted:
                  value:
                    data:
                      id: 1
                      name: '2026'
                      active: true
                    metadata:
                      status: 202
                      error: false
                      message: null
                      code: ''
                  summary: Delete custom TLD — accepted
          description: TLD deletion accepted and queued; response `data` is a snapshot of the TLD before deletion. An email is sent when deletion completes (or fails).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_serializer'
          description: Invalid request — e.g. default TLD, multi-currency entity TLD, non-TLD, source-dimension TLD, or active ERP dimension mappings still reference this TLD subtree.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_serializer'
          description: Permission denied — user cannot manage dimensions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_serializer'
          description: Dimension not found or not a cube TLD (e.g. source-data-table root)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response_serializer'
          description: Preflight failed — cube has active work (publish lock, import blocks, or maintenance lock).
  /dimensions/tree:
    get:
      operationId: dimensions_tree_retrieve
      description: This endpoint retrieves the company's dimensions structured in their hierarchy
      summary: Get Dimensions Tree
      parameters:
      - in: header
        name: X-Company-ID
        schema:
          type: string
        description: Associates request with company
        required: true
      - in: query
        name: can_be_mapped
        schema:
          type: boolean
          default: false
        description: The result will be limited to dimensions that can be mapped to source systems.
      - in: query
        name: inactive
        schema:
          type: boolean
          default: false
        description: The result will also include inactive dimensions.
      - in: query
        name: include_operations
        schema:
          type: boolean
          default: false
        description: The result will include data about which operations are allowed against a given dimension (i.e. disable_block_reason, enable_block_reason).
      - in: query
        name: include_tag_members
        schema:
          type: boolean
          default: false
        description: The result will also include tag members.
      - in: query
        name: include_tags
        schema:
          type: boolean
          default: false
        description: The result will also include tags.
      - in: query
        name: tld_id
        schema:
          type: integer
        description: The result will be limited to dimensions under this top-level dimension
      tags:
      - Dimensions
      security:
      - OAuth2: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dimension'
          description: The Dimension
