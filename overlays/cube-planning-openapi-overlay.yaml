overlay: 1.0.0
info:
  title: API Evangelist enhancements for Cube API
  version: 1.0.0
extends: openapi/cube-planning-openapi-original.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: cube-planning
    x-apievangelist-category: fp-and-a
    x-apievangelist-auth: oauth2-authorization-code-pkce
    x-apievangelist-tenant-header: X-Company-ID
    x-apievangelist-versioning: accept-header
- target: $.info.contact
  update:
    name: Cube Developer Center
    url: https://www.cubesoftware.com/developer-center
- target: $.info.license
  update:
    name: Cube Terms of Service
    url: https://www.cubesoftware.com/terms-of-service
