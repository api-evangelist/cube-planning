aid: cube-planning
name: Cube Planning
description: >-
  Cube (Cube Software) is a financial planning & analysis (FP&A) platform that positions itself as an
  "agentic finance layer" — giving finance teams clean, decision-ready data everywhere FP&A happens by
  harmonizing data across their existing tool stack (ERPs, accounting, HRIS, CRM, data warehouses, and
  spreadsheets like Excel and Google Sheets) and automating planning, budgeting, and forecasting workflows.
  Cube exposes a public REST API at api.cubesoftware.com with 296 operations across 16 tags — dimensions,
  formulas, data tables, cube data exports, dashboards, connections, tags, attributes, and company/user
  administration — secured with OAuth 2.0 authorization-code + PKCE and multi-tenant via an X-Company-ID
  header. Cube is a Battery Ventures portfolio company. Enriched by the API Evangelist pipeline from Cube's
  public OpenAPI and developer surface.
